id: api10-unsafe-consumption-oob-schema-wide
info:
  name: API10 Unsafe Consumption of APIs - OOB Value-Shape Probe
  author: dast-scanner
  severity: high
  description: Same URL value-shape gate bug as api7 existed here for the header pass (rejected nuclei's generic 'string' placeholder on format:uri fields). Fixed with the same broadened gate. Body/query passes were already unconditional ('.*') and unaffected.
  classification:
    cwe-id: CWE-918
  tags: api,owasp-api10,unsafe-consumption,oob,dast
http:
- fuzzing:
  - part: query
    type: replace
    mode: single
    keys-regex:
    - .*
    fuzz:
    - '{{interactsh-url}}'
    - http://{{interactsh-url}}
  - part: header
    type: replace
    mode: single
    keys-regex:
    - .*
    values:
    - ^[a-zA-Z][a-zA-Z0-9+.-]*://|^string$|^$
    fuzz:
    - '{{interactsh-url}}'
    - http://{{interactsh-url}}
  - part: body
    type: replace
    mode: single
    keys-regex:
    - .*
    fuzz:
    - '{{interactsh-url}}'
    - http://{{interactsh-url}}
  matchers-condition: or
  matchers:
  - type: word
    part: interactsh_protocol
    words:
    - http
    - https
    - dns
    condition: or
  - type: word
    part: body
    words:
    - '{{interactsh-url}}'
