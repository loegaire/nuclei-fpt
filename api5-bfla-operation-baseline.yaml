id: api5-bfla-operation-baseline

info:
  name: API5 Broken Function Level Authorization - Accepted Mutation (value-shape aware)
  author: dast-scanner
  severity: medium
  description: >
    Same value-shape logic as api1, restricted to state-changing operations.
  classification: { cwe-id: CWE-862 }
  tags: api,owasp-api5,bfla,authorization,dast

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method != "GET"'
          - 'method != "HEAD"'
          - 'method != "OPTIONS"'
        condition: and
    fuzzing:
      - part: path
        type: replace-regex
        mode: single
        values: ['^[0-9]+$']
        replace-regex: '[0-9]+'
        fuzz: ['0', '-1', '2', '999999', '2147483648']
      - part: path
        type: replace-regex
        mode: single
        values: ['^[0-9a-fA-F-]{16,}$']
        replace-regex: '[0-9a-fA-F-]{16,}'
        fuzz: ['00000000-0000-4000-8000-000000000002']
      - part: query
        type: replace
        mode: single
        keys-regex: ['.*']
        values: ['^-?[0-9]+$']
        fuzz: ['0', '-1', '2', '999999', '2147483648']
      - part: body
        type: replace
        mode: single
        keys-regex: ['.*']
        values: ['^-?[0-9]+$']
        fuzz: ['0', '-1', '2', '999999', '2147483648']
    matchers:
      - type: dsl
        dsl: ['status_code >= 200 && status_code < 400']
